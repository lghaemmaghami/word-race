name: Update Leaderboard

on:
  repository_dispatch:
    types: [update-leaderboard]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: leaderboard-update
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update leaderboard JSON
        run: |
          node -e "
          const fs = require('fs');
          const path = 'public/leaderboard.json';
          const MAX = 10;

          let list = [];
          try { list = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
          if (!Array.isArray(list)) list = [];

          const entry = JSON.parse(process.env.ENTRY_JSON);
          if (!entry.playerName || typeof entry.playerScore !== 'number') {
            console.log('Invalid entry, skipping');
            process.exit(0);
          }

          entry.id = Date.now() + '-' + Math.random().toString(36).slice(2, 8);
          entry.date = new Date().toISOString();
          list.push(entry);
          list.sort((a, b) => b.playerScore - a.playerScore);
          list = list.slice(0, MAX);

          if (!list.some(e => e.id === entry.id)) {
            console.log('Score did not make top ' + MAX + ', skipping');
            process.exit(0);
          }

          fs.writeFileSync(path, JSON.stringify(list, null, 2) + '\n');
          console.log('Leaderboard updated');
          "
        env:
          ENTRY_JSON: ${{ toJson(github.event.client_payload) }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/leaderboard.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update leaderboard"
          git push
